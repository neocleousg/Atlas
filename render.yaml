# ΑΤΛΑΣ στο Render: ΔΩΡΕΑΝ δοκιμαστική εκδοχή με εικονικά δεδομένα.
# Οδηγίες βήμα-βήμα: docs/RENDER.md
#
# Πώς δουλεύει το δωρεάν πακέτο, και γιατί μας βολεύει:
# - «Κοιμάται» μετά από ~15 λεπτά χωρίς επισκέπτες και ξυπνά σε ~1 λεπτό.
# - Δεν κρατά αρχεία: σε κάθε ξύπνημα η βάση (SQLite) είναι άδεια, και ο ΑΤΛΑΣ φτιάχνει μόνος του
#   φρέσκα εικονικά δεδομένα με τη σημερινή ημερομηνία. Δηλαδή αυτόματη επαναφορά, χωρίς κόστος.
# - Καμία βάση PostgreSQL: η δωρεάν του Render λήγει μετά από λίγες εβδομάδες.
#
# Για το πιλοτικό με πραγματικά δεδομένα ΔΕΝ είναι κατάλληλο (χάνει τα δεδομένα).

services:
  - type: web
    name: atlas
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py bootstrap &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /syndesi/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # Το Render βάζει έναν proxy μπροστά από την εφαρμογή. Χωρίς αυτό, όλοι οι χρήστες
      # θα φαίνονταν με την ίδια IP και το όριο αποπειρών σύνδεσης θα κλείδωνε όλους μαζί.
      - key: DJANGO_TRUSTED_PROXIES
        value: "1"
      - key: ATLAS_DEMO
        value: "1"
      # Τα παρακάτω τα συμπληρώνετε εσείς όταν δημιουργείτε την εφαρμογή (δεν μπαίνουν στο GitHub).
      - key: ATLAS_ADMIN_USERNAME
        sync: false
      - key: ATLAS_ADMIN_PASSWORD
        sync: false
      - key: ATLAS_DEMO_PASSWORD
        sync: false
