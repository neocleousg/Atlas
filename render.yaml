# ΑΤΛΑΣ στο Render: δοκιμαστική εκδοχή με εικονικά δεδομένα.
# Οδηγίες βήμα-βήμα: docs/RENDER.md
#
# Server και βάση στη Φρανκφούρτη (ΕΕ). Το Render ενημερώνει μόνο του την εφαρμογή
# σε κάθε αλλαγή του main.

services:
  - type: web
    name: atlas
    runtime: python
    region: frankfurt
    plan: starter            # Το δωρεάν πακέτο «κοιμάται» και αργεί να ξυπνήσει: όχι για συνάντηση.
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py bootstrap &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /syndesi/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # Το Render βάζει έναν proxy μπροστά από την εφαρμογή. Χωρίς αυτό, όλοι οι χρήστες
      # θα φαίνονταν με την ίδια IP και το όριο αποπειρών σύνδεσης θα κλείδωνε όλους μαζί.
      - key: DJANGO_TRUSTED_PROXIES
        value: "1"
      - key: ATLAS_DEMO
        value: "1"
      # Τα παρακάτω τα συμπληρώνετε εσείς όταν δημιουργείτε την εφαρμογή (δεν μπαίνουν στο GitHub).
      - key: ATLAS_ADMIN_USERNAME
        sync: false
      - key: ATLAS_ADMIN_PASSWORD
        sync: false
      - key: ATLAS_DEMO_PASSWORD
        sync: false

databases:
  - name: atlas-db
    databaseName: atlas
    user: atlas
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []          # Καμία πρόσβαση στη βάση από το internet: μόνο από την εφαρμογή.
